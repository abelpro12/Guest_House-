{% extends 'base.html' %}

{% block title %}Register Guest{% endblock %}
{% block page_title %}New Guest Profile Registration{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <h3 class="text-base font-bold text-white mb-6 border-b border-slate-800 pb-3">Guest Information</h3>

    <form method="post" class="space-y-4 text-xs">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Full Name</label>
            <input type="text" name="full_name" required placeholder="Full Name" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Phone Number</label>
                <input type="text" name="phone_number" required placeholder="+251 ..." class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Email (Optional)</label>
                <input type="email" name="email" placeholder="guest@email.com" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">ID Document Type</label>
                <select name="id_document_type" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                    <option value="national_id">National ID / Kebele ID</option>
                    <option value="passport">Passport</option>
                    <option value="driver_license">Driver License</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">ID Document Number</label>
                <input type="text" name="id_document_number" required placeholder="ID Number" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Nationality</label>
                <input type="text" name="nationality" value="Ethiopian" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Address</label>
                <input type="text" name="address" placeholder="City / Region" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <div class="p-3 bg-slate-800/50 rounded-lg border border-slate-700 flex items-center space-x-2">
            <input type="checkbox" name="create_user_account" value="1" id="chkUser" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0">
            <label for="chkUser" class="text-xs text-slate-300 font-semibold cursor-pointer">Create Guest Portal Login Account (Password: Guest@1234)</label>
        </div>

        <div class="pt-4 flex justify-end space-x-3">
            <a href="{% url 'guests:list' %}" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-semibold">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg">Save Guest Profile</button>
        </div>
    </form>
</div>
{% endblock %}
