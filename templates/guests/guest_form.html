{% extends 'base.html' %}

{% block title %}Register Guest{% endblock %}
{% block page_title %}New Guest Profile Registration{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <h3 class="text-base font-bold text-white mb-6 border-b border-slate-800 pb-3">Guest Information</h3>

    <form method="post" enctype="multipart/form-data" class="space-y-4 text-xs">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Full Name</label>
            <input type="text" name="full_name" value="{{ guest.full_name|default:'' }}" required placeholder="Full Name" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Phone Number</label>
                <input type="text" name="phone_number" value="{{ guest.phone_number|default:'' }}" required placeholder="+251 ..." class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Email (Optional)</label>
                <input type="email" name="email" value="{{ guest.email|default:'' }}" placeholder="guest@email.com" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">ID Document Type</label>
                <select name="id_document_type" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                    <option value="national_id" {% if guest.id_document_type == 'national_id' %}selected{% endif %}>National ID / Kebele ID</option>
                    <option value="passport" {% if guest.id_document_type == 'passport' %}selected{% endif %}>Passport</option>
                    <option value="driver_license" {% if guest.id_document_type == 'driver_license' %}selected{% endif %}>Driver License</option>
                    <option value="other" {% if guest.id_document_type == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">ID Document Number</label>
                <input type="text" name="id_document_number" value="{{ guest.id_document_number|default:'' }}" required placeholder="ID Number" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <!-- ID Photo Upload -->
        <div>
            <label class="block font-semibold text-slate-300 mb-1">Upload ID / Passport Scan (Optional)</label>
            <input type="file" name="id_photo" accept="image/*,.pdf" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/20 file:text-indigo-300 hover:file:bg-indigo-600/30 cursor-pointer border border-slate-800 rounded-lg p-1 bg-slate-800/50">
            {% if guest.id_photo %}
                <p class="text-[11px] text-emerald-400 mt-1"><i class="fa-solid fa-paperclip mr-1"></i> Current File: <a href="{{ guest.id_photo.url }}" target="_blank" class="underline">View Attached Document</a></p>
            {% endif %}
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Nationality</label>
                <input type="text" name="nationality" value="{{ guest.nationality|default:'Ethiopian' }}" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
                <label class="block font-semibold text-slate-300 mb-1">Address</label>
                <input type="text" name="address" value="{{ guest.address|default:'' }}" placeholder="City / Region" class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
            </div>
        </div>

        <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700 space-y-3">
            <div class="flex items-center space-x-2">
                <input type="checkbox" name="create_user_account" value="1" id="chkUser" {% if guest.user %}checked{% endif %} onchange="toggleGuestPortalFields(this)" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0">
                <label for="chkUser" class="text-xs text-slate-300 font-bold cursor-pointer">{% if guest.user %}Update Guest Portal Credentials{% else %}Create Guest Portal Login Account{% endif %}</label>
            </div>

            <!-- Custom Username & Password Input Fields -->
            <div id="guestPortalFields" class="{% if not guest.user %}hidden{% endif %} pt-3 border-t border-slate-700/80 space-y-3">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Guest Username</label>
                        <input type="text" name="guest_username" id="guestUsername" value="{{ guest.user.username|default:'' }}" placeholder="e.g. phone or username" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">Guest Password</label>
                        <div class="relative">
                            <input type="password" name="guest_password" id="guestPassword" value="" placeholder="Enter Password (or leave blank for Guest@1234)" class="w-full pl-4 pr-10 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-medium">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1 focus:outline-none">
                                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function toggleGuestPortalFields(chk) {
                const fields = document.getElementById('guestPortalFields');
                if (chk.checked) {
                    fields.classList.remove('hidden');
                    const phoneInput = document.querySelector('input[name="phone_number"]');
                    const usernameInput = document.getElementById('guestUsername');
                    if (phoneInput && usernameInput && !usernameInput.value) {
                        usernameInput.value = phoneInput.value;
                    }
                } else {
                    fields.classList.add('hidden');
                }
            }

            function togglePasswordVisibility() {
                const passInput = document.getElementById('guestPassword');
                const eyeIcon = document.getElementById('eyeIcon');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                } else {
                    passInput.type = 'password';
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                }
            }
        </script>

        <div class="pt-4 flex justify-end space-x-3">
            <a href="{% url 'guests:list' %}" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-semibold">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg">Save Guest Profile</button>
        </div>
    </form>
</div>
{% endblock %}
